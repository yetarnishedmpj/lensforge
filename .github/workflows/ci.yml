name: LensForge CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run automated test suite with pytest
        run: |
          pytest -v

      - name: Validate CLI execution
        run: |
          lensforge-reconstruct --output-dir ci_outputs/

      - name: Execute SLACS benchmark case study (Linux only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          python scripts/benchmark_slacs_reconstruction.py

